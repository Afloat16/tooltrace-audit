[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tooltrace-audit"
version = "0.1.0"
description = "Offline tool execution and conversation trace diagnostics for duplicate attempts, overlapping retries and unmatched results."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Afloat16"}]
dependencies = []

[project.urls]
Repository = "https://github.com/Afloat16/tooltrace-audit"
Issues = "https://github.com/Afloat16/tooltrace-audit/issues"

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.scripts]
tooltrace-audit = "tooltrace_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
